<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — L3</title>

  <link rel="stylesheet" href="css/style.css">

  <script>
    // Restore the collapsed-sidebar state before first paint so the panel
    // doesn't flash open on every load.
    try {
      if (localStorage.getItem('punkolink_sidebar_collapsed') === '1') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  </script>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle workspace panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="dashboard.html" class="logo">
        <span class="logo-dot"></span>
        punkolink
      </a>
    </div>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="billing.html">Billing</a>
    </nav>
    <div class="nav-user">
      <span class="nav-user-tag" id="navUserTag"></span>
      <a href="#" class="btn btn-ghost btn-sm hidden" id="navLogout">Log Out</a>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar">
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Workspace</div>
        <a class="sidebar-link" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
          </svg>
          <span class="sidebar-link-label">Database</span>
        </a>
        <a class="sidebar-link" href="in-memory.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
          </svg>
          <span class="sidebar-link-label">In-memory</span>
        </a>
        <a class="sidebar-link" href="document.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/>
          </svg>
          <span class="sidebar-link-label">Document</span>
        </a>
        <a class="sidebar-link active" href="l3.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 4 6 4 9s-1.4 6.3-4 9c-2.6-2.7-4-6-4-9s1.4-6.3 4-9z"/>
          </svg>
          <span class="sidebar-link-label">L3</span>
        </a>
        <a class="sidebar-link" href="l7.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11l8-4M8 13l8 4"/>
          </svg>
          <span class="sidebar-link-label">L7</span>
        </a>
        <a class="sidebar-link" href="drp.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
          </svg>
          <span class="sidebar-link-label">DRP</span>
        </a>
        <a class="sidebar-link" href="backends.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><path d="M8 7h.01M8 17h.01"/>
          </svg>
          <span class="sidebar-link-label">Backends</span>
        </a>
      </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main>
      <div class="shell shell-full">
        <div class="page-head">
          <div>
            <div class="page-tag">Workspace</div>
            <h1 class="page-title">L3</h1>
          </div>
          <button class="btn btn-primary" id="rentBtn" disabled>Rent Address</button>
        </div>

        <div class="banner" id="l3Banner"></div>

        <div class="toolbar">
          <div class="form-group" style="margin-bottom: 0; min-width: 140px;">
            <label class="form-label" for="familySelect">Type</label>
            <select class="form-select" id="familySelect">
              <option value="ipv4">IPv4</option>
              <option value="ipv6">IPv6</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0; min-width: 220px;">
            <label class="form-label" for="regionSelect">Region</label>
            <select class="form-select" id="regionSelect"></select>
          </div>
          <div class="toolbar-info" id="ipCount"></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Address</th>
                <th>Type</th>
                <th>Region</th>
                <th>Rented</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ipsBody">
              <tr class="empty-row"><td colspan="5">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/l3.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
