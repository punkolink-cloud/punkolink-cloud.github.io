<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — L7</title>

  <link rel="stylesheet" href="css/style.css">

  <script>
    // Restore the collapsed-sidebar state before first paint so the panel
    // doesn't flash open on every load.
    try {
      if (localStorage.getItem('punkolink_sidebar_collapsed') === '1') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  </script>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle workspace panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <a href="dashboard.html" class="logo">
        <span class="logo-dot"></span>
        punkolink
      </a>
    </div>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="billing.html">Billing</a>
    </nav>
    <div class="nav-user">
      <span class="nav-user-tag" id="navUserTag"></span>
      <a href="#" class="btn btn-ghost btn-sm hidden" id="navLogout">Log Out</a>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar">
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Workspace</div>
        <a class="sidebar-link" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>
          </svg>
          <span class="sidebar-link-label">Managed Services</span>
        </a>
        <a class="sidebar-link active" href="l7.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11l8-4M8 13l8 4"/>
          </svg>
          <span class="sidebar-link-label">L7</span>
        </a>
        <a class="sidebar-link" href="drp.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
          </svg>
          <span class="sidebar-link-label">DRP</span>
        </a>
      </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main>
      <div class="shell">
        <div class="page-head">
          <div>
            <div class="page-tag">Workspace</div>
            <h1 class="page-title">L7</h1>
          </div>
        </div>

        <div class="section-card">
          <h3>Not available yet</h3>
          <p class="section-desc">Control for the L7 router will live in this section. It's a placeholder for now — the switcher on the left is what's being wired up first.</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>Session.requireAuth();</script>
  <script src="js/sidebar.js"></script>
</body>
</html>
