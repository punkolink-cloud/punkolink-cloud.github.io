<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      punkolink
    </a>
    <nav class="nav">
      <a href="register.html">Create Account</a>
    </nav>
  </header>

  <main>
    <div class="shell-narrow">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Log In</h1>
          <p>Access your services and billing.</p>
        </div>

        <div class="banner" id="formBanner"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="jdoe@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log In</button>
          </div>
        </form>

        <div class="auth-switch">
          Need an account? <a href="register.html">Create one</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const banner = document.getElementById('formBanner');
      const submitBtn = document.getElementById('submitBtn');

      const REASON_MESSAGES = {
        invalid_credentials: 'Invalid email or password.',
        email_not_verified: 'Confirm your email first — check your inbox for the link we sent.',
      };

      if (Session.get()) {
        window.location.href = 'dashboard.html';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';
        banner.classList.remove('visible');

        const result = await AuthApi.login(email, password);

        if (!result.ok || !result.data || !result.data.token) {
          const reason = result.data && result.data.reason;
          banner.textContent = REASON_MESSAGES[reason] || 'Invalid email or password.';
          banner.classList.add('visible');
          banner.classList.remove('success');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        Session.save(result.data.token);
        window.location.href = 'dashboard.html';
      });
    })();
  </script>
</body>
</html>
