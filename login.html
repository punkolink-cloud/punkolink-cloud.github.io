<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — Log In</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      punkolink
    </a>
    <nav class="nav">
      <a href="register.html">Create Account</a>
    </nav>
  </header>

  <main>
    <div class="shell-narrow">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Log In</h1>
          <p>Access your services and billing.</p>
        </div>

        <div class="banner" id="formBanner"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="jdoe@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log In</button>
          </div>
        </form>

        <div class="auth-divider">or</div>

        <a href="#" class="btn btn-secondary btn-block btn-google" id="googleBtn" rel="nofollow">
          <svg class="btn-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </a>

        <div class="auth-switch">
          Need an account? <a href="register.html">Create one</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const banner = document.getElementById('formBanner');
      const submitBtn = document.getElementById('submitBtn');

      const REASON_MESSAGES = {
        invalid_credentials: 'Invalid email or password.',
        email_not_verified: 'Confirm your email first — check your inbox for the link we sent.',
      };

      if (Session.get()) {
        window.location.href = 'dashboard.html';
      }

      // Same host-resolution rule as api.js (API_BASE): in dev the auth
      // service may sit on another origin, in prod it's the reverse
      // proxy. A plain link to the backend's start endpoint — the Google
      // consent screen is served by Google after the redirect.
      document.getElementById('googleBtn').href = API_BASE + '/auth/google/start';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';
        banner.classList.remove('visible');

        const result = await AuthApi.login(email, password);

        if (!result.ok || !result.data || !result.data.token) {
          const reason = result.data && result.data.reason;
          banner.textContent = REASON_MESSAGES[reason] || 'Invalid email or password.';
          banner.classList.add('visible');
          banner.classList.remove('success');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        Session.save(result.data.token);
        window.location.href = 'dashboard.html';
      });
    })();
  </script>
</body>
</html>
