<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — Create Account</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      punkolink
    </a>
    <nav class="nav">
      <a href="login.html">Log In</a>
    </nav>
  </header>

  <main>
    <div class="shell-narrow">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Create Account</h1>
          <p>Set up access to the control panel.</p>
        </div>

        <div class="banner" id="formBanner"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="jdoe@example.com" required>
            <span class="form-error" id="errEmail">A valid email is required.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required>
            <span class="form-error" id="errPassword">Password is required.</span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
          </div>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    (function () {
      const form = document.getElementById('registerForm');
      const banner = document.getElementById('formBanner');
      const submitBtn = document.getElementById('submitBtn');

      const REASON_MESSAGES = {
        invalid_email: 'Enter a valid email address.',
        password_required: 'Password is required.',
        email_already_registered: 'That email is already registered.',
        email_send_failed: 'Couldn’t send the confirmation email — try again shortly.',
        internal_error: 'Something went wrong. Try again.',
      };

      function showBanner(message, isError) {
        banner.textContent = message;
        banner.classList.add('visible');
        banner.classList.toggle('success', !isError);
      }

      // Already logged in? No need to register again.
      if (Session.get()) {
        window.location.href = 'dashboard.html';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        let valid = true;
        if (!email) {
          document.getElementById('email').classList.add('invalid');
          document.getElementById('errEmail').classList.add('visible');
          valid = false;
        }
        if (!password) {
          document.getElementById('password').classList.add('invalid');
          document.getElementById('errPassword').classList.add('visible');
          valid = false;
        }
        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating…';
        banner.classList.remove('visible');

        const registerResult = await AuthApi.register(email, password);

        if (!registerResult.ok) {
          const reason = registerResult.data && registerResult.data.reason;
          showBanner(REASON_MESSAGES[reason] || 'Registration failed.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // No token comes back, and logging in wouldn't work yet anyway —
        // the account isn't usable until the confirmation email is
        // clicked. Send them to log in once that's done instead of
        // pretending this is instant.
        form.reset();
        showBanner('Account created — check your email for a confirmation link, then log in.', false);
        submitBtn.textContent = 'Create Account';
        setTimeout(function () { window.location.href = 'login.html'; }, 3000);
      });
    })();
  </script>
</body>
</html>
