<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punkolink — Create Account</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a href="dashboard.html" class="logo">
      <span class="logo-dot"></span>
      punkolink
    </a>
    <nav class="nav">
      <a href="login.html">Log In</a>
    </nav>
  </header>

  <main>
    <div class="shell-narrow">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Create Account</h1>
          <p>Set up access to the control panel.</p>
        </div>

        <div class="banner" id="formBanner"></div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" placeholder="jdoe@example.com" required>
            <span class="form-error" id="errEmail">A valid email is required.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required>
            <span class="form-error" id="errPassword">Password is required.</span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
          </div>
        </form>

        <div class="auth-divider">or</div>

        <a href="#" class="btn btn-secondary btn-block btn-google" id="googleBtn" rel="nofollow">
          <svg class="btn-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign up with Google
        </a>

        <div class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Punkolink — internal control panel.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>
    (function () {
      const form = document.getElementById('registerForm');
      const banner = document.getElementById('formBanner');
      const submitBtn = document.getElementById('submitBtn');

      const REASON_MESSAGES = {
        invalid_email: 'Enter a valid email address.',
        password_required: 'Password is required.',
        email_already_registered: 'That email is already registered.',
        email_send_failed: 'Couldn’t send the confirmation email — try again shortly.',
        internal_error: 'Something went wrong. Try again.',
      };

      function showBanner(message, isError) {
        banner.textContent = message;
        banner.classList.add('visible');
        banner.classList.toggle('success', !isError);
      }

      // Already logged in? No need to register again.
      if (Session.get()) {
        window.location.href = 'dashboard.html';
      }

      // Same host-resolution rule as api.js (API_BASE): a plain link to
      // the backend's start endpoint — Google serves its own consent
      // screen after the redirect, so no external Google script is
      // loaded here.
      document.getElementById('googleBtn').href = API_BASE + '/auth/google/start';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        let valid = true;
        if (!email) {
          document.getElementById('email').classList.add('invalid');
          document.getElementById('errEmail').classList.add('visible');
          valid = false;
        }
        if (!password) {
          document.getElementById('password').classList.add('invalid');
          document.getElementById('errPassword').classList.add('visible');
          valid = false;
        }
        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating…';
        banner.classList.remove('visible');

        const registerResult = await AuthApi.register(email, password);

        if (!registerResult.ok) {
          const reason = registerResult.data && registerResult.data.reason;
          showBanner(REASON_MESSAGES[reason] || 'Registration failed.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // No token comes back, and logging in wouldn't work yet anyway —
        // the account isn't usable until the confirmation email is
        // clicked. Send them to log in once that's done instead of
        // pretending this is instant.
        form.reset();
        showBanner('Account created — check your email for a confirmation link, then log in.', false);
        submitBtn.textContent = 'Create Account';
        setTimeout(function () { window.location.href = 'login.html'; }, 3000);
      });
    })();
  </script>
</body>
</html>
