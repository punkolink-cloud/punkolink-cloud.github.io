<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Punkolink — Control Panel</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Pure client-side redirect gate: no landing content lives here.
       Check for a valid, unexpired session and send the visitor
       straight on — authenticated → dashboard, otherwise → login.
       session.js must load before the redirect script so `Session`
       is defined; both run in <head> so nothing paints first. -->
  <script src="js/session.js"></script>
  <script>
    (function () {
      var session = Session.get();
      // location.replace, not href: this gate must not enter history,
      // or Back from dashboard/login would bounce straight back here.
      window.location.replace(session ? 'dashboard.html' : 'login.html');
    })();
  </script>
</head>
<body>
  <noscript>
    <p style="padding: var(--space-6, 24px);">
      JavaScript is required. <a href="login.html">Continue to sign in</a>.
    </p>
  </noscript>
</body>
</html>
